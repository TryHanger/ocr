services:
  postgres:
    image: postgres:16-alpine
    container_name: document_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: document_ai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/document_ai
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/document_ai
      STORAGE_LOCAL_PATH: /data/documents
      RESEARCH_ROOT_PATH: /repo
      OCR_EXECUTION_PROVIDER: ${OCR_EXECUTION_PROVIDER:-cpu}
    ports:
      - "8000:8000"
    volumes:
      - documents_data:/data/documents
      - ../src:/repo/src:ro
      - ../data:/repo/data:ro
      - ../experiments:/repo/experiments:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: document_ai_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.pipeline_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/document_ai
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/document_ai
      STORAGE_LOCAL_PATH: /data/documents
      RESEARCH_ROOT_PATH: /repo
      OCR_EXECUTION_PROVIDER: ${OCR_EXECUTION_PROVIDER:-cpu}
    volumes:
      - documents_data:/data/documents
      - ../src:/repo/src:ro
      - ../data:/repo/data:ro
      - ../experiments:/repo/experiments:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: document_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: document_ai_postgres_data
  documents_data:
    name: document_ai_documents_data
