# SROIE2019 Degradation Baseline (B1) Configuration on GPU (CUDA)
# Evaluates 8 degradations × 4 severities × P0 (32 conditions) + 1 control (D0_S0_P0) = 33 conditions on SROIE Validation Split (N=126)
# Hardware: NVIDIA GeForce RTX 3050 Laptop GPU (CUDAExecutionProvider)
# Delta baseline reference: B0_GPU (b0_clean_validation_n126_gpu)
version: "1.0.0"
experiment_seed: 42

dataset:
  root: "data/SROIE2019"
  candidate_roots:
    - "data/SROIE2019"
    - "data"
  split: "validation"
  subset_size: null  # Evaluates all N=126 validation documents
  subset_seed: 42

degradation_config: "configs/degradation.yaml"
b0_reference_path: "experiments/runs/b0_clean_validation_n126_gpu/summary.json"

# B1 Matrix definition: 8 degradations × 4 severities × P0 + 1 control
matrix:
  include_control: true  # D0_S0_P0 (control reference)
  degradations:
    - "gaussian_blur"
    - "motion_blur"
    - "gaussian_noise"
    - "jpeg_compression"
    - "downsampling"
    - "rotation"
    - "perspective"
    - "shadow"
  severities:
    - 1
    - 2
    - 3
    - 4
  preprocessing_pipelines: {}

ocr:
  engine_name: "rapidocr"
  package_version: "3.9.2"
  execution_provider: "cuda"
  reading_order:
    line_tolerance_factor: 0.5
  resize_policy:
    max_side_len: 2000
    min_side_len: 30
    det_limit_side_len: 736
    det_limit_type: "min"
  parameters:
    text_score: 0.5
    min_confidence: 0.0
    use_cls: true

kie:
  engine_name: "rule_based"
  engine:
    fallback_largest_amount: false
    fallback_penalty: 0.5
    min_confidence_threshold: 0.2

evaluation:
  target_fields:
    - "company"
    - "date"
    - "address"
    - "total"
  bootstrap:
    iterations: 1000
    ci: 0.95
    seed: 42

output:
  output_dir: "experiments/runs"
  save_images: false
