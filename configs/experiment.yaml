# SROIE Robustness Experiment Matrix Configuration
# Unified Runner Configuration across Baselines B0, B1, and B2
version: "1.0.0"
experiment_seed: 42

dataset:
  root: "data/SROIE2019"
  candidate_roots:
    - "data/SROIE2019"
    - "data"
  split: "development"
  subset_size: 100
  subset_seed: 42

# Primary matrix definition
matrix:
  include_control: true  # D0_S0_P0 (B0)
  # Degradations evaluated across B1 and B2
  degradations:
    - "gaussian_blur"
    - "motion_blur"
    - "gaussian_noise"
    - "jpeg_compression"
    - "downsampling"
    - "rotation"
    - "perspective"
    - "shadow"
  # Discrete calibrated severities (severity 0 strictly reserved for control)
  severities:
    - 1
    - 2
    - 3
    - 4
  # Preprocessing pipelines for B2 conditions
  preprocessing_pipelines:
    p_clahe:
      - "clahe"
    p_denoise:
      - "denoise"
    p_denoise_clahe:
      - "denoise"
      - "clahe"

# Minimal CPU smoke matrix (per TASK-010-R1 Section 3)
smoke_matrix:
  conditions:
    - "D0_S0_P0"
    - "D1_S1_P0"
    - "D1_S4_P0"
    - "D1_S1_P_clahe"
    - "D1_S4_P_clahe"

ocr:
  engine_name: "rapidocr"
  package_version: "3.9.2"
  reading_order:
    line_tolerance_factor: 0.5
  resize_policy:
    max_side_len: 2000
    min_side_len: 30
    det_limit_side_len: 736
    det_limit_type: "min"
  parameters:
    text_score: 0.5
    min_confidence: 0.0
    use_cls: true

kie:
  engine_name: "rule_based"
  engine:
    fallback_largest_amount: false
    fallback_penalty: 0.5
    min_confidence_threshold: 0.2

evaluation:
  target_fields:
    - "company"
    - "date"
    - "address"
    - "total"
  bootstrap:
    iterations: 1000
    ci: 0.95
    seed: 42

output:
  output_dir: "experiments/runs"
  save_images: false
