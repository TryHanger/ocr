# SROIE2019 Preprocessing Robustness (B2) Configuration on GPU (CUDA)
# Evaluates 1 Control (D0_S0_P0) + 8 degradations × 4 severities × 4 pipelines (128 conditions) = 129 conditions
# on SROIE Validation Split (N=126, total 16,254 evaluations)
# Hardware: NVIDIA GeForce RTX 3050 Laptop GPU (CUDAExecutionProvider)
# References: B0_GPU (b0_clean_validation_n126_gpu) and B1_GPU (b1_degraded_validation_n126_gpu)
version: "1.0.0"
experiment_seed: 42

dataset:
  root: "data/SROIE2019"
  candidate_roots:
    - "data/SROIE2019"
    - "data"
  split: "validation"
  subset_size: null  # Evaluates all N=126 validation documents
  subset_seed: 42

degradation_config: "configs/degradation.yaml"
b0_reference_path: "experiments/runs/b0_clean_validation_n126_gpu/summary.json"
b1_reference_path: "experiments/runs/b1_degraded_validation_n126_gpu/summary.json"

# B2 Matrix definition: 1 control + 128 degradation x preprocessing conditions (include_b1: false)
matrix:
  include_control: true  # D0_S0_P0
  include_b1: false      # B1 P0 is taken from external frozen reference, NOT re-generated
  degradations:
    - "gaussian_blur"
    - "motion_blur"
    - "gaussian_noise"
    - "jpeg_compression"
    - "downsampling"
    - "rotation"
    - "perspective"
    - "shadow"
  severities:
    - 1
    - 2
    - 3
    - 4
  preprocessing_pipelines:
    p_minimal_cleanup:
      steps:
        - grayscale
        - denoise
      parameters:
        denoise:
          method: median
          ksize: 3
    p_contrast_enhancement:
      steps:
        - grayscale
        - clahe
      parameters:
        clahe:
          clip_limit: 2.0
          tile_grid_size: [8, 8]
    p_standard_receipt_enhancement:
      steps:
        - deskew
        - clahe
        - denoise
      parameters:
        deskew:
          max_angle: 15.0
        clahe:
          clip_limit: 2.0
          tile_grid_size: [8, 8]
        denoise:
          method: median
          ksize: 3
    p_aggressive_binarization:
      steps:
        - grayscale
        - binarization
      parameters:
        binarization:
          method: gaussian
          block_size: 11
          c: 2.0

ocr:
  engine_name: "rapidocr"
  package_version: "3.9.2"
  execution_provider: "cuda"
  reading_order:
    line_tolerance_factor: 0.5
  resize_policy:
    max_side_len: 2000
    min_side_len: 30
    det_limit_side_len: 736
    det_limit_type: "min"
  parameters:
    text_score: 0.5
    min_confidence: 0.0
    use_cls: true

kie:
  engine_name: "rule_based"
  engine:
    fallback_largest_amount: false
    fallback_penalty: 0.5
    min_confidence_threshold: 0.2

evaluation:
  target_fields:
    - "company"
    - "date"
    - "address"
    - "total"
  bootstrap:
    iterations: 1000
    ci: 0.95
    seed: 42

output:
  output_dir: "experiments/runs"
  save_images: false
