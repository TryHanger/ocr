# Key Information Extraction (KIE) Baseline Configuration
# SROIE Rule-Based Downstream Baseline
#
# NOTE: Heuristics and regex patterns configured below are provisional engineering
# baselines tailored to Malaysian receipt structures (SROIE). They are not claimed to be
# universally optimal or transferable across generic receipt domains without recalibration.
# Anti-overfitting principle: Parameters are generic across receipt structures and do not
# encode document-specific IDs, single-image coordinates, or overfitted magic values.
version: "1.0.0"

engine:
  name: "rule_based"
  model_name: "sroie_rule_based_kie"
  model_version: "1.0.0"
  min_confidence_threshold: 0.2
  # Fallback: Assigning the largest numeric amount to 'total' is an aggressive heuristic.
  # It is strictly disabled by default (TASK-009 / TASK-009-R1 requirement).
  # If enabled for ablation, a heavy confidence penalty is applied.
  fallback_largest_amount: false
  fallback_penalty: 0.5

# Spatial and semantic rules for each target field
fields:
  company:
    header_max_relative_y: 0.35
    header_max_line_index: 5
    min_length: 3
    max_length: 100
    legal_keywords:
      - "SDN BHD"
      - "SDN. BHD."
      - "BHD"
      - "BHD."
      - "LTD"
      - "LIMITED"
      - "INC"
      - "CORP"
      - "ENTERPRISE"
      - "TRADING"
      - "RESTAURANT"
      - "SUPERMARKET"
      - "MART"
      - "CAFE"
      - "PHARMACY"
      - "STORE"
      - "MARKET"
      - "BAKERY"
      - "STATION"
      - "HOTEL"
      - "RETAIL"
    negative_keywords:
      - "INVOICE"
      - "RECEIPT"
      - "TAX"
      - "TOTAL"
      - "DATE"
      - "TEL"
      - "FAX"
      - "CASHIER"
      - "TABLE"
      - "BILL"
      - "ORDER"
      - "GST NO"
      - "REG NO"

  date:
    date_keywords:
      - "DATE"
      - "TARIKH"
      - "TIME"
      - "MASA"
      - "DT"
    min_year: 1990
    max_year: 2035
    regex_patterns:
      # DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY
      - '(?<!\d)(\d{1,2})[/\-\.](\d{1,2})[/\-\.](\d{2,4})(?!\d)'
      # YYYY/MM/DD or YYYY-MM-DD
      - '(?<!\d)(\d{4})[/\-\.](\d{1,2})[/\-\.](\d{1,2})(?!\d)'
      # DD-Mon-YYYY or DD Mon YYYY (e.g., 25 Dec 2018)
      - '(?<!\d)(\d{1,2})[\s\-\.](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[\s\-\.](\d{2,4})(?!\d)'

  total:
    total_keywords:
      - "TOTAL"
      - "GRAND TOTAL"
      - "AMOUNT"
      - "AMOUNT DUE"
      - "BALANCE DUE"
      - "NET TOTAL"
      - "TOTAL AMOUNT"
      - "TOTAL RM"
      - "TOTAL MYR"
      - "JUMLAH"
    negative_keywords:
      - "SUBTOTAL"
      - "SUB TOTAL"
      - "SUB-TOTAL"
      - "CHANGE"
      - "CASH"
      - "ROUNDING"
      - "GST"
      - "TAX"
      - "DISCOUNT"
      - "SERVICE CHARGE"
      - "ITEMS"
      - "QTY"
      - "TOTAL ITEM"
      - "TOTAL ITEMS"
      - "BALANCE"
      - "TENDER"
      - "VISA"
      - "MASTER"
      - "DEBIT"
      - "CREDIT"
    currency_symbols:
      - "RM"
      - "MYR"
      - "$"
    amount_regex: '(?:RM|MYR|\$)?\s*([0-9]{1,6}\.[0-9]{2})\b'

  address:
    max_lines: 6
    max_relative_y: 0.60
    location_keywords:
      - "NO."
      - "NO "
      - "LOT"
      - "JALAN"
      - "JLN"
      - "LORONG"
      - "STREET"
      - "ROAD"
      - "RD"
      - "TAMAN"
      - "BANDAR"
      - "SEKSYEN"
      - "SELANGOR"
      - "KUALA LUMPUR"
      - "PENANG"
      - "JOHOR"
      - "MALAYSIA"
      - "PERAK"
      - "PAHANG"
      - "MELAKA"
      - "KEDAH"
      - "NEGERI SEMBILAN"
      - "SARAWAK"
      - "SABAH"
      - "WILAYAH PERSEKUTUAN"
      - "PUCHONG"
      - "PETALING JAYA"
      - "SUBANG JAYA"
      - "KLANG"
      - "SHAH ALAM"
    postcode_regex: '\b\d{5}\b'
    negative_keywords:
      - "TEL"
      - "FAX"
      - "EMAIL"
      - "WWW"
      - "HTTP"
      - "GST NO"
      - "REG NO"
      - "ROC"
      - "TAX INVOICE"
      - "CASHIER"

evaluation:
  target_fields:
    - "company"
    - "date"
    - "address"
    - "total"
  analytical_metrics:
    - "precision"
    - "recall"
    - "f1"
    - "macro_precision"
    - "macro_recall"
    - "macro_f1"
    - "raw_doc_em"
    - "normalized_doc_em"
  sroie_official_compatible:
    - "entity_precision"
    - "entity_recall"
    - "entity_hmean"
